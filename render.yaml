# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Persistence model
# -----------------
# Health checkup data (profiles/test_items/measurements) ships as
# `data/health.db` in git — the app reads it through get_local_conn(),
# so it's available immediately on every deploy. PATCH edits to that DB
# only persist across deploys if you commit the updated file.
#
# Nutrition data (logs/values) lives in Turso when configured. Set
# `TURSO_DATABASE_URL` + `TURSO_AUTH_TOKEN` in the Render dashboard to
# survive deploys; otherwise the local SQLite copy is used and Render's
# ephemeral filesystem will wipe it on each redeploy.

services:
  - type: web
    name: ydocter
    runtime: python
    plan: free
    region: singapore        # closest to KR; change if you prefer
    buildCommand: |
      pip install -r requirements.txt
      python -m app.load_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Python version is read from runtime.txt; this env var is the
      # canonical way to pin it on Render and overrides runtime.txt.
      - key: PYTHON_VERSION
        value: "3.12"

      # ---- Turso (production persistence) ----
      # Set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN in the Render dashboard
      # (Settings → Environment). `sync: false` keeps them editable in
      # the dashboard and out of source control.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # ---- yclaude (Claude CLI gateway) ----
      # YCLAUDE_BASE_URL and YCLAUDE_API_KEY are required for the
      # "free-text -> structured day log" feature. Set them in the
      # Render dashboard — do NOT commit secrets here.
      - key: YCLAUDE_BASE_URL
        sync: false
      - key: YCLAUDE_API_KEY
        sync: false
      - key: YCLAUDE_CLIENT_ID
        value: ydocter
      # Optional: pin a Claude model. Otherwise the yclaude server's
      # DEFAULT_MODEL is used.
      # - key: YCLAUDE_MODEL
      #   value: opus
