<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>API DOC — ydocter 레퍼런스</title>
<link rel="icon" type="image/svg+xml" href="/assets/doctor.svg?v={{V}}" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #222220;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --series-1:  #3987e5;
    --series-2:  #d95926;

    --font-display: 'Anton', 'IBM Plex Sans KR', sans-serif;
    --font-body:    'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
    --font-mono:    'IBM Plex Mono', 'SF Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--page); color: var(--ink);
    font-family: var(--font-body); font-size: 14px; line-height: 1.7;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 48px 48px;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 24px 100px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 18px; margin-bottom: 8px;
  }
  header h1 {
    font-family: var(--font-display);
    font-size: clamp(40px, 7vw, 64px);
    line-height: 0.95; text-transform: uppercase; letter-spacing: 0.01em;
  }
  header h1 .accent { color: var(--series-1); }
  .header-meta { text-align: right; color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
  .page-nav { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .page-nav a {
    display: inline-block; padding: 5px 11px; text-decoration: none;
    border: 1px solid var(--baseline); color: var(--ink-2);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  }
  .page-nav a:hover { border-color: var(--muted); color: var(--ink); }

  /* ─── 렌더된 마크다운 ──────────────────────────────────── */
  #doc { padding-top: 16px; }
  #doc h1 { display: none; }  /* 문서 첫 h1은 페이지 헤더와 중복 */
  #doc h2 {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--series-1);
    margin: 44px 0 14px; padding-top: 18px;
    border-top: 1px solid var(--grid);
    display: flex; align-items: center; gap: 10px;
  }
  #doc h2::before { content: ""; width: 22px; height: 2px; background: var(--series-1); flex: none; }
  #doc h3 {
    font-size: 15px; font-weight: 700; color: var(--ink);
    margin: 28px 0 8px;
  }
  #doc h3 code { font-size: 14px; }
  #doc p { color: var(--ink-2); margin: 8px 0; }
  #doc strong { color: var(--ink); }
  #doc ul, #doc ol { margin: 8px 0 8px 22px; color: var(--ink-2); }
  #doc li { margin: 3px 0; }
  #doc hr { border: none; border-top: 1px solid var(--grid); margin: 36px 0; }
  #doc a { color: var(--series-1); }

  #doc code {
    font-family: var(--font-mono); font-size: 12.5px;
    background: var(--surface-2); color: var(--series-1);
    padding: 1px 6px; border: 1px solid var(--grid);
  }
  #doc pre {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 3px solid var(--series-1);
    padding: 14px 16px; margin: 12px 0; overflow-x: auto;
  }
  #doc pre code {
    background: none; border: none; padding: 0;
    color: var(--ink-2); font-size: 12.5px; line-height: 1.65;
  }

  #doc table {
    border-collapse: collapse; width: 100%; margin: 12px 0;
    background: var(--surface-1); border: 1px solid var(--border);
    font-size: 13px;
  }
  #doc th, #doc td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  #doc th {
    font-size: 11px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    border-bottom: 2px solid var(--baseline); white-space: nowrap;
  }
  #doc td { color: var(--ink-2); }
  #doc td code { white-space: nowrap; }
  #doc tr:last-child td { border-bottom: none; }
  #doc blockquote { border-left: 3px solid var(--baseline); padding: 2px 14px; color: var(--muted); margin: 10px 0; }

  /* ─── 목차 ─────────────────────────────────────────────── */
  #toc {
    background: var(--surface-1); border: 1px solid var(--border);
    padding: 14px 18px; margin-top: 20px;
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    font-family: var(--font-mono); font-size: 12px;
  }
  #toc a { color: var(--ink-2); text-decoration: none; }
  #toc a:hover { color: var(--series-1); }
  #toc a::before { content: "¶ "; color: var(--muted); }

  .loading { color: var(--muted); font-family: var(--font-mono); font-size: 13px; padding: 40px 0; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  header, #toc, #doc { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  #toc { animation-delay: .05s; } #doc { animation-delay: .1s; }

  @media (max-width: 640px) {
    .wrap { padding-left: 14px; padding-right: 14px; }
    header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .header-meta { text-align: left; }
    .page-nav { justify-content: flex-start; }
    #doc table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>API<span class="accent">/</span>Doc</h1>
    <div class="header-meta">
      클라이언트 개발용 레퍼런스 · 원문 <a href="/docs/API.md" style="color:var(--series-1)">API.md</a> · 라이브 테스트 <a href="/docs" style="color:var(--series-2)">Swagger</a>
      <nav class="page-nav">
        <a href="/">Workout</a>
        <a href="/notes">Notes</a>
        <a href="/dashboard">Records</a>
      </nav>
    </div>
  </header>

  <nav id="toc" style="display:none"></nav>
  <article id="doc"><div class="loading">문서 로딩 중…</div></article>

</div>

<script>
"use strict";
(async () => {
  const doc = document.getElementById("doc");
  try {
    const res = await fetch("/docs/API.md?v={{V}}");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    doc.innerHTML = marked.parse(md, { gfm: true });

    // h2 기반 목차 생성 + 앵커 부여
    const toc = document.getElementById("toc");
    const h2s = [...doc.querySelectorAll("h2")];
    if (h2s.length) {
      toc.style.display = "flex";
      toc.innerHTML = h2s.map((h, i) => {
        const id = "sec-" + i;
        h.id = id;
        return `<a href="#${id}">${h.textContent}</a>`;
      }).join("");
    }
  } catch (e) {
    doc.innerHTML = `<div class="loading">문서 로딩 실패: ${String(e.message).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</div>`;
  }
})();
</script>
</body>
</html>
