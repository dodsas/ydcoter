<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="ydocter">
  <title>ydocter</title>

  <defs>
    <!-- Warm ivory gradient — same paper tone the rest of the app uses,
         lifted diagonally so the tile reads as 'lit'. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FBF3DA"/>
      <stop offset="55%" stop-color="#F2E6BF"/>
      <stop offset="100%" stop-color="#E6D49E"/>
    </linearGradient>

    <!-- Brand red with subtle vertical depth on the cross. -->
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#CB3D2E"/>
      <stop offset="100%" stop-color="#9D2618"/>
    </linearGradient>

    <!-- Soft drop shadow so the cross sits *on* the paper. -->
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background. iOS rounds the corners itself. -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Watermark pulse line traversing horizontally behind the cross —
       carries the 'health ledger' meaning at a glance, kept low-opacity
       so it doesn't fight the cross. -->
  <path d="M 14 90 L 50 90 L 58 74 L 66 108 L 75 84 L 84 96 L 90 90
           L 96 96 L 105 84 L 114 108 L 122 74 L 130 90 L 166 90"
        fill="none"
        stroke="#B83227" stroke-opacity="0.18"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Medical cross (rounded plus). Generous padding from the edges so
       iOS's corner mask never clips into the arms. -->
  <g filter="url(#softshadow)">
    <rect x="36" y="74" width="108" height="32" rx="10" fill="url(#cross)"/>
    <rect x="74" y="36" width="32" height="108" rx="10" fill="url(#cross)"/>
  </g>

  <!-- Glossy top highlight along the upper edge of the vertical arm. -->
  <rect x="78" y="40" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.32"/>
</svg>
